<!-- Custom HTML site displayed as the Home chapter -->

{% extends "main.html" %}
{% block tabs %}
{{ super() }}
<style>
    .md-container {
        height: 100%;
        background: var(--md-primary-fg-color);
        background-repeat: no-repeat;
        background-size: cover;
        overflow: hidden;
    }

    .md-main {
        flex-grow: 0;
        height: 0px;
        background: var(--md-primary-fg-color)
    }

    .md-main__inner {
        display: flex;
        height: 100%;
    }

    .tx-container {
        padding-top: .0rem;
        background: var(--md-primary-fg-color);
        background-size: cover;
    }

    .tx-container .md-grid {
        max-width: min(96vw, 1800px);
    }

    .tx-hero {
        margin: 32px 2.8rem;
        color: var(--md-primary-bg-color);
        justify-content: center;
        flex-direction: column;
    }

    .tx-hero h1 {
        margin-bottom: 1rem;
        color: currentColor;
        font-weight: 700
    }

    .tx-hero__content {
        padding-bottom: 1rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
    }

    .tx-hero__image {
        width: min(88vw, 980px);
        aspect-ratio: 16 / 6;
        height: auto;
        order: 0;
        position: relative;
        opacity: .95;
    }

    .tx-hero__image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    .tx-hero .md-button {
        margin-top: .5rem;
        margin-right: .5rem;
        color: var(--md-primary-bg-color)
    }

    .tx-hero .md-button--primary {
        background-color: var(--md-primary-bg-color);
        color: rgb(0, 0, 0);
        border-color: var(--md-primary-bg-color)
    }

    .tx-hero .md-button:focus,
    .tx-hero .md-button:hover {
        background-color: var(--md-accent-fg-color);
        color: var(--md-default-bg-color);
        border-color: var(--md-accent-fg-color)
    }

    @media screen and (min-width:60em) {
        .md-sidebar--secondary {
            display: none
        }

        .tx-hero {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tx-hero__content {
            margin-top: 3.5rem;
            margin-bottom: 3.5rem;
            margin-left: 1.0rem;
            margin-right: 4.0rem;
            align-items: center;
        }
    }

    @media screen and (min-width:76.25em) {
        .md-sidebar--primary {
            display: none
        }
    }

    .event {
        display: flex;
        justify-content: center;
        width: min(72%, 610px);
        height: auto;
        margin: 0 auto;
    }

    .event img {
        width: 100%;
        height: auto;
        display: block;
    }
</style>

<section class="tx-container">
    <div class="md-grid md-typeset">
        <div class="tx-hero">
            <div class="tx-hero__content">
                <h1>
                    <script>
                        var title = document.querySelector('meta[name="description"]').content
                        document.write(title)
                    </script>
                </h1>
                <div class="tx-hero__image">
                    <div class="event"><img src="template_assets/cisco-live.svg" draggable="false" alt="Cisco Live"></div>
                </div>
                <div><a href="welcome/" title="{{ page.next_page.title | striptags }}"
                        class="md-button md-button--primary">
                        Get started
                    </a></div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
{% block content %} {% endblock %}
{% block footer %} {% endblock %}
