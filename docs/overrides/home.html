<!-- Custom HTML site displayed as the Home chapter -->

{% extends "main.html" %}
{% block tabs %}
{{ super() }}
<style>
    .md-container {
        height: 100%;
        background: var(--md-primary-fg-color);
        background-repeat: no-repeat;
        background-size: cover;
        overflow: hidden;
    }

    .md-main {
        flex-grow: 0;
        height: 0px;
        background: var(--md-primary-fg-color)
    }

    .md-main__inner {
        display: flex;
        height: 100%;
    }

    .tx-container {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        padding-top: .0rem;
        min-height: calc(100svh - 4.8rem);
        display: flex;
        align-items: center;
        background:
            radial-gradient(ellipse 60% 50% at 15% 25%, rgba(0, 189, 235, .55), transparent 70%),
            radial-gradient(ellipse 55% 50% at 80% 25%, rgba(140, 60, 255, .70), transparent 70%),
            radial-gradient(ellipse 70% 55% at 75% 95%, rgba(255, 46, 140, .60), transparent 70%),
            linear-gradient(135deg, #04103a 0%, #1a0f5c 45%, #3b0f6e 100%);
        background-size: 200% 200%;
        animation: tx-glow 24s ease-in-out infinite alternate;
    }

    .tx-container::before,
    .tx-container::after {
        content: "";
        position: absolute;
        inset: -20%;
        z-index: -1;
        pointer-events: none;
    }

    .tx-container::before {
        background:
            radial-gradient(circle at 10% 30%, rgba(0, 189, 235, .55) 0 3.5rem, transparent 3.6rem),
            radial-gradient(circle at 30% 75%, rgba(122, 60, 255, .45) 0 5rem, transparent 5.1rem),
            radial-gradient(circle at 55% 20%, rgba(255, 255, 255, .18) 0 2.5rem, transparent 2.6rem),
            radial-gradient(circle at 75% 65%, rgba(255, 46, 140, .40) 0 4.5rem, transparent 4.6rem),
            radial-gradient(circle at 90% 15%, rgba(0, 189, 235, .35) 0 3rem, transparent 3.1rem),
            radial-gradient(circle at 45% 90%, rgba(0, 189, 235, .30) 0 6rem, transparent 6.1rem);
        filter: blur(28px);
        animation: tx-drift 30s ease-in-out infinite alternate;
    }

    .tx-container::after {
        background-image:
            radial-gradient(1.5px 1.5px at 20px 30px, rgba(255, 255, 255, .9), transparent),
            radial-gradient(1px 1px at 90px 120px, rgba(255, 255, 255, .7), transparent),
            radial-gradient(1.5px 1.5px at 160px 60px, rgba(180, 230, 255, .8), transparent),
            radial-gradient(1px 1px at 230px 170px, rgba(255, 255, 255, .6), transparent),
            radial-gradient(2px 2px at 300px 90px, rgba(255, 200, 240, .7), transparent);
        background-size: 340px 220px;
        animation: tx-twinkle 6s ease-in-out infinite alternate, tx-drift 60s linear infinite reverse;
    }

    @keyframes tx-glow {
        from { background-position: 0% 0%; }
        to { background-position: 100% 100%; }
    }

    @keyframes tx-drift {
        from { transform: translate3d(-3%, -2%, 0) rotate(0deg); }
        to { transform: translate3d(3%, 2%, 0) rotate(4deg); }
    }

    @keyframes tx-twinkle {
        from { opacity: .35; }
        to { opacity: .9; }
    }

    @media (prefers-reduced-motion: reduce) {
        .tx-container,
        .tx-container::before,
        .tx-container::after {
            animation: none;
        }
    }

    .tx-container .md-grid {
        max-width: min(96vw, 1800px);
    }

    .tx-hero {
        margin: 32px 2.8rem;
        color: var(--md-primary-bg-color);
        justify-content: center;
        flex-direction: column;
    }

    .tx-hero h1 {
        margin-bottom: 1rem;
        color: currentColor;
        font-weight: 700
    }

    .tx-hero__content {
        padding-bottom: 1rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
    }

    .tx-hero__image {
        width: min(88vw, 980px);
        aspect-ratio: 16 / 6;
        height: auto;
        order: 0;
        position: relative;
        opacity: .95;
    }

    .tx-hero__image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    .tx-hero .md-button {
        margin-top: .5rem;
        margin-right: .5rem;
        color: var(--md-primary-bg-color)
    }

    .tx-hero .md-button--primary {
        background-color: var(--md-primary-bg-color);
        color: rgb(0, 0, 0);
        border-color: var(--md-primary-bg-color);
        margin-top: 2.5rem;
        padding: .7em 2.4em;
        font-size: .9rem;
        border-radius: .2rem;
        box-shadow: 0 8px 30px rgba(0, 189, 235, .35)
    }

    .tx-hero .md-button:focus,
    .tx-hero .md-button:hover {
        background-color: var(--md-accent-fg-color);
        color: var(--md-default-bg-color);
        border-color: var(--md-accent-fg-color)
    }

    @media screen and (min-width:60em) {
        .md-sidebar--secondary {
            display: none
        }

        .tx-hero {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tx-hero__content {
            margin-top: 3.5rem;
            margin-bottom: 3.5rem;
            margin-left: 1.0rem;
            margin-right: 4.0rem;
            align-items: center;
        }
    }

    @media screen and (min-width:76.25em) {
        .md-sidebar--primary {
            display: none
        }
    }

    .event {
        display: flex;
        justify-content: center;
        width: min(72%, 610px);
        height: auto;
        margin: 0 auto;
    }

    .event img {
        width: 100%;
        height: auto;
        display: block;
    }
</style>

<section class="tx-container">
    <div class="md-grid md-typeset">
        <div class="tx-hero">
            <div class="tx-hero__content">
                <h1>
                    <script>
                        var title = document.querySelector('meta[name="description"]').content
                        document.write(title)
                    </script>
                </h1>
                <div class="tx-hero__image">
                    <div class="event"><img src="template_assets/cisco-live.svg" draggable="false" alt="Cisco Live"></div>
                </div>
                <div><a href="welcome/" title="{{ page.next_page.title | striptags }}"
                        class="md-button md-button--primary">
                        Get started
                    </a></div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
{% block content %} {% endblock %}
{% block footer %} {% endblock %}
